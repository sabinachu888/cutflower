<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>SUNPRIDE 蝴蝶蘭配貨台</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
html,body{margin:0}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
/* Layout: one-screen spreadsheet workbench — top bar, week strip, toolbar, grid (left + bottom sliders) beside a collapsible info rail */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --ink:#1b2220; --muted:#5f6a66; --line:#dde2df; --line2:#bcc5c1;
  --accent:#7b2d6c; --accent-soft:#f4e7f1; --accent-ink:#ffffff;
  --supply:#fff3bf; --remain:#e5f1e2; --sub:#eef1ef; --sec:#f7f3e8;
  --neg:#c3261f; --neg-bg:#fde7e5; --warn:#a85a00; --warn-bg:#ffe6c4; --ok:#2e7d32;
  --sel:#7b2d6c; --std:#1d5f8a;
  --f-ui:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Barlow Semi Condensed","Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111413; --surface:#191d1b; --ink:#e4e9e6; --muted:#9aa49f; --line:#2b322f; --line2:#3e4743;
  --accent:#d38cc3; --accent-soft:#3a2234; --accent-ink:#1b0f18;
  --supply:#3a3416; --remain:#1c2d1d; --sub:#1f2523; --sec:#262219;
  --neg:#ff7a70; --neg-bg:#3e1d1a; --warn:#ffb459; --warn-bg:#43301a; --ok:#7bc97f; --sel:#d38cc3; --std:#86c0e8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111413; --surface:#191d1b; --ink:#e4e9e6; --muted:#9aa49f; --line:#2b322f; --line2:#3e4743;
  --accent:#d38cc3; --accent-soft:#3a2234; --accent-ink:#1b0f18;
  --supply:#3a3416; --remain:#1c2d1d; --sub:#1f2523; --sec:#262219;
  --neg:#ff7a70; --neg-bg:#3e1d1a; --warn:#ffb459; --warn-bg:#43301a; --ok:#7bc97f; --sel:#d38cc3; --std:#86c0e8; color-scheme:dark}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:13px;display:flex;flex-direction:column;overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:1px}
.pad{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
/* top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);padding-block:6px}
.brand{font-family:var(--f-num);font-weight:700;letter-spacing:.08em;font-size:13px;color:var(--accent);white-space:nowrap}
.brand b{font-family:var(--f-ui);letter-spacing:0;color:var(--ink);font-weight:700;margin-left:4px}
.tabs{display:flex;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px}
.tabs button{border:0;background:transparent;padding:4px 10px;border-radius:5px;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--surface);box-shadow:0 0 0 1px var(--line2);font-weight:700}
.badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--neg);color:#fff;font-size:10px;line-height:16px;text-align:center;margin-left:3px;font-family:var(--f-num)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.save{font-size:11px;color:var(--muted);white-space:nowrap}
.save.ok::before{content:"● ";color:var(--ok)}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:3px 9px;white-space:nowrap;line-height:1.4}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.sm{padding:1px 6px;font-size:11px}
select.sel{border:1px solid var(--line2);background:var(--surface);border-radius:6px;padding:3px 4px}
/* week strip */
.weekbar{display:flex;align-items:center;gap:8px;background:var(--surface);border-bottom:1px solid var(--line);padding-block:5px}
.weeks{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;flex:1;min-width:0;padding-bottom:3px}
.wk{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 9px;text-align:left;line-height:1.25}
.wk b{font-family:var(--f-num);font-size:14px;display:block}
.wk small{color:var(--muted);font-size:10px;font-family:var(--f-num)}
.wk.sug{background:var(--accent-soft)}
.wk.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wk.cur small{color:inherit;opacity:.85}
.wk i{font-style:normal;font-size:9px;display:block;color:inherit;opacity:.8}
.wkjump{width:92px;border:1px solid var(--line2);border-radius:6px;padding:3px 6px;background:var(--surface);font-family:var(--f-num)}
/* views */
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.toolbar{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;padding-block:6px;border-bottom:1px solid var(--line);background:var(--bg)}
.tg{display:flex;align-items:center;gap:4px;white-space:nowrap}
.tg label{display:flex;align-items:center;gap:3px;cursor:pointer}
.zoomr{width:110px;accent-color:var(--accent)}
.zv{font-family:var(--f-num);min-width:36px;text-align:right}
.q{border:1px solid var(--line2);border-radius:6px;padding:3px 7px;width:130px;background:var(--surface)}
.chip{font-size:11px;border:1px dashed var(--line2);border-radius:10px;padding:1px 8px;background:transparent}
.work{flex:1;min-height:0;display:flex}
.gridwrap{flex:1;min-width:0;display:grid;grid-template-columns:20px minmax(0,1fr);grid-template-rows:minmax(0,1fr) 20px;background:var(--surface)}
.scroller{overflow:auto;position:relative;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
/* custom sliders */
.vs,.hs{position:relative;background:var(--bg);touch-action:none;user-select:none}
.vs{border-right:1px solid var(--line)}
.hs{grid-column:2;border-top:1px solid var(--line)}
.corner{background:var(--bg);border-top:1px solid var(--line);border-right:1px solid var(--line)}
.thumb{position:absolute;background:var(--line2);border-radius:6px;cursor:grab}
.vs .thumb{left:4px;right:4px;min-height:28px}
.hs .thumb{top:4px;bottom:4px;min-width:28px}
.thumb:hover,.thumb.drag{background:var(--accent)}
/* grid */
table.g{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:calc(12.5px*var(--z));width:max-content}
.g th,.g td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:var(--rh);padding:0;background:var(--surface);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.g thead th{background:var(--sub);font-weight:500}
.g .lt{height:calc(var(--rh)*.78);font-size:.82em;color:var(--muted);text-align:center;position:relative;cursor:default;user-select:none;font-family:var(--f-num)}
.g .lt.mv{background:var(--accent-soft);color:var(--ink)}
.g .gut{color:var(--muted);text-align:center;font-family:var(--f-num);font-size:.8em;user-select:none;background:var(--sub)}
.g .lab{padding:0 6px;text-align:left;font-weight:500}
.g .lab small{color:var(--muted);font-weight:400;margin-left:4px}
.g input{width:100%;height:100%;border:0;background:transparent;padding:0 5px;outline:none;font-family:var(--f-num);font-size:inherit;font-variant-numeric:tabular-nums}
.g input.n{text-align:right}
.g input.t{font-family:var(--f-ui);text-align:left}
.g input.code{text-align:center;font-weight:700;font-size:1.05em}
.g input.var{text-align:center;color:var(--muted);font-size:.92em}
.g td:focus-within,.g th:focus-within{box-shadow:inset 0 0 0 2px var(--sel)}
.g td.ro{font-family:var(--f-num);text-align:right;padding:0 5px;font-variant-numeric:tabular-nums}
.g .sup td,.g .sup th{background:var(--supply)}
.g .rem td,.g .rem th{background:var(--remain);font-weight:600}
.g .pr td,.g .pr th{background:var(--sec);color:var(--muted)}
.g .grp td,.g .grp th{background:var(--sub);font-weight:600}
.g .grp .lab{cursor:pointer}
.g .sec td,.g .sec th{background:var(--sec)}
.g .sech th{background:var(--sec);text-align:left;padding:0 6px;font-weight:700;font-size:.9em;letter-spacing:.04em;color:var(--muted)}
.g .neg{color:var(--neg)!important}
.g td.neg,.g td.ro.neg{background:var(--neg-bg)!important}
.g td.alarm{background:var(--neg)!important;color:#fff!important;font-weight:700}
.g td.alarm::after{content:" !"}
.g .over input{color:var(--neg)}
.g .cdem{color:var(--accent);font-weight:600}
.g .cdem small{color:var(--muted);font-weight:400}
.g th.act{box-shadow:inset 0 -3px 0 var(--accent)}
.g tr.actrow th.gut{background:var(--accent);color:var(--accent-ink)}
.g .unk{color:var(--muted);font-style:italic}
.g .rz{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:2;touch-action:none}
.g .rz:hover{background:var(--accent);opacity:.4}
.g .mvb{display:inline-flex;gap:1px}
.g .mvb button{border:1px solid var(--line2);background:var(--surface);border-radius:3px;padding:0 3px;font-size:.85em;line-height:1.2}
.g .addb{border:0;background:transparent;color:var(--accent);font-weight:700;padding:0 4px}
.g select.rg{width:100%;height:100%;border:0;background:transparent;font-size:inherit;padding:0 2px}
.g.fz-top thead th,.g.fz-top thead td{position:sticky;z-index:3}
.g .sl{position:sticky;z-index:2}
.g thead .sl,.g.fz-top thead .sl{z-index:6}
.g td.prov input{font-style:italic;color:var(--muted)}
.g td.anyc{background:var(--bg);font-style:italic;cursor:default}
.g td.anyc.under{color:var(--warn);font-weight:600}
.g th.anyh{background:var(--accent-soft)}
.g th.anyh .avar{color:var(--warn);font-size:.92em;font-weight:500}
.g.noA .cA{border-right:0;visibility:hidden}
.g td.auto input{color:var(--std);font-style:italic}
.g td.ovr{background-image:linear-gradient(135deg,var(--warn) 0 6px,transparent 6px)}
.g td.stdc input{color:var(--std);font-weight:500}
.lg{display:inline-block;font-family:var(--f-num);padding:0 6px;margin:0 3px 0 8px;border:1px solid var(--line);background:var(--surface)}
.lg.auto{color:var(--std);font-style:italic}
.lg.ovr{background-image:linear-gradient(135deg,var(--warn) 0 6px,transparent 6px)}
.legend{font-size:11px;color:var(--muted);white-space:nowrap}
.who{font-weight:700;font-size:12px;border:1px solid var(--line2);border-radius:6px;padding:2px 8px}
table.std td{padding:3px 4px}
table.std select,table.std input{border:1px solid var(--line2);border-radius:5px;padding:3px 5px;background:var(--surface);font-size:12.5px;max-width:190px}
table.std input.num{width:64px;text-align:right;font-family:var(--f-num)}
table.std input.wkin{width:60px;font-family:var(--f-num)}
table.std .mvc{white-space:nowrap}
input.lnk{width:100%;min-width:220px;border:1px solid var(--line2);border-radius:5px;padding:4px 6px;background:var(--bg);font-family:var(--f-num);font-size:12px;color:var(--ink)}
.btn.dis{opacity:.45;pointer-events:none}
.g .tag{font-size:.75em;color:var(--warn);margin-left:3px}
/* info rail */
.info{width:300px;flex:0 0 300px;border-left:1px solid var(--line);background:var(--surface);overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.info[data-collapsed="true"]{width:34px;flex-basis:34px;padding:8px 4px}
.info[data-collapsed="true"] .ib{display:none}
.ih{display:flex;align-items:flex-start;gap:6px}
.ih h2{font-family:var(--f-num);font-size:22px;margin:0;line-height:1}
.ih p{margin:2px 0 0;color:var(--muted);font-size:12px}
.ih .btn{margin-left:auto}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kp div{border:1px solid var(--line);border-radius:6px;padding:4px 6px}
.kp span{display:block;font-size:10px;color:var(--muted)}
.kp b{font-family:var(--f-num);font-size:17px;font-variant-numeric:tabular-nums}
.alert{border-radius:6px;padding:6px 8px;background:var(--neg-bg);color:var(--neg);font-weight:600;font-size:12px}
.note{color:var(--muted);font-size:11px;line-height:1.5}
table.mini{width:100%;border-collapse:collapse;font-size:12px}
.mini th{font-weight:500;color:var(--muted);text-align:right;padding:3px 4px;border-bottom:1px solid var(--line2);font-size:11px}
.mini th:first-child,.mini td:first-child{text-align:left}
.mini td{padding:3px 4px;border-bottom:1px solid var(--line);text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.mini td:first-child{font-family:var(--f-ui)}
.mini tr.hl td{background:var(--accent-soft)}
.mini .any{font-size:10px;color:var(--warn);margin-left:3px}
.info h3{margin:0;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.05em}
/* import panel */
.imp{border-bottom:1px solid var(--line);background:var(--sec);padding-block:8px;display:flex;flex-direction:column;gap:6px;max-height:45vh;overflow:auto}
.imp .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.imp table{border-collapse:collapse;font-size:12px;background:var(--surface)}
.imp th,.imp td{border:1px solid var(--line);padding:2px 6px;text-align:right;font-family:var(--f-num);white-space:nowrap}
.imp td:nth-child(-n+2),.imp th:nth-child(-n+2){text-align:left}
.up{color:var(--ok)} .dn{color:var(--neg)}
.prog{font-size:12px;color:var(--muted)}
/* pending + request views */
.page{flex:1;overflow:auto;padding-block:12px}
.page-in{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.panel h2{margin:0 0 8px;font-size:15px}
.tblx{overflow-x:auto}
table.list{border-collapse:collapse;width:100%;font-size:12.5px}
.list th{text-align:left;font-weight:500;color:var(--muted);border-bottom:1px solid var(--line2);padding:5px 6px;white-space:nowrap;font-size:11.5px}
.list td{border-bottom:1px solid var(--line);padding:4px 6px;white-space:nowrap}
.list td.n,.list th.n{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.list tr.click{cursor:pointer}
.list tr.click:hover td{background:var(--accent-soft)}
.st{font-size:11px;border-radius:9px;padding:1px 7px;border:1px solid var(--line2);white-space:nowrap}
.st.wait{border-color:var(--warn);color:var(--warn)}
.st.part{background:var(--warn-bg);border-color:transparent;color:var(--warn)}
.st.done{border-color:var(--ok);color:var(--ok)}
.st.map{background:var(--neg-bg);color:var(--neg);border-color:transparent}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.ntc{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.ntc div{border-left:3px solid var(--warn);padding:3px 8px;background:var(--bg)}
.ntc time{color:var(--muted);font-family:var(--f-num);margin-right:6px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.form label{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted)}
.form input,.form select{border:1px solid var(--line2);border-radius:6px;padding:5px 7px;background:var(--surface);font-size:13px;color:var(--ink)}
.form .wkout{font-family:var(--f-num);font-size:13px;color:var(--ink);padding:5px 0}
table.req{border-collapse:collapse;width:100%;font-size:13px}
.req th{position:sticky;top:0;background:var(--sub);font-weight:500;font-size:11.5px;color:var(--muted);text-align:left;padding:5px 6px;z-index:1}
.req td{border-bottom:1px solid var(--line);padding:0 6px;height:32px}
.req td.code{font-family:var(--f-num);font-weight:700;font-size:14px}
.req td.vr{color:var(--muted);font-size:12px}
.req td.gr{font-family:var(--f-num);color:var(--muted);font-size:12px}
.req input.qty{width:76px;text-align:right;border:1px solid var(--line2);border-radius:5px;padding:4px 6px;font-family:var(--f-num);font-size:15px;background:var(--surface)}
.req input.qty:not(:placeholder-shown){border-color:var(--accent);background:var(--accent-soft)}
.req input.tx{width:100%;min-width:70px;border:1px solid var(--line2);border-radius:5px;padding:4px 6px;background:var(--surface)}
.req td.rp{font-family:var(--f-num);text-align:right}
.req tr.fx td.code::after{content:"固定";font-size:9px;color:var(--muted);font-weight:400;margin-left:4px;font-family:var(--f-ui)}
.req tr.anyrow td.vr{color:var(--warn)}
.reqbar{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border-top:1px solid var(--line2);padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px))}
.reqbar b{font-family:var(--f-num);font-size:16px}
.tickets{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.tk{flex:0 0 auto;border:1px solid var(--line);border-radius:7px;padding:6px 9px;background:var(--surface);text-align:left;min-width:150px}
.tk b{display:block}
.tk small{color:var(--muted);font-family:var(--f-num)}
.tk.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.hint{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:5px 8px}
.drop{border:1px dashed var(--line2);border-radius:7px;padding:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.drop img{height:54px;border-radius:4px;border:1px solid var(--line)}
/* pin */
.pin{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 92%,transparent);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.pin form{background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:10px;width:min(300px,100%)}
.pin input{font-family:var(--f-num);font-size:22px;letter-spacing:.4em;text-align:center;border:1px solid var(--line2);border-radius:6px;padding:6px;background:var(--surface)}
.toast{position:fixed;left:50%;bottom:calc(36px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);border-radius:8px;padding:7px 12px;font-size:12.5px;z-index:60;display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:5px;padding:1px 7px}
.proto{font-size:10.5px;color:var(--muted)}
@media (max-width:900px){
  .work{flex-direction:column}
  .info{width:auto;flex:0 0 auto;max-height:42vh;border-left:0;border-top:1px solid var(--line)}
  .info[data-collapsed="true"]{width:auto;flex-basis:auto;max-height:34px;padding:6px 12px}
  .gridwrap{min-height:300px}
}
@media (max-width:560px){
  .brand b{display:none}
  .q{width:100px}
  .zoomr{width:80px}
  .tg.opt{display:none}
  .toolbar.open .tg.opt{display:flex}
}
@media (min-width:561px){ #moreBtn{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<header class="top pad">
  <div class="brand">SUNPRIDE<b>蝴蝶蘭配貨台</b></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="top-r">
    <span class="save" id="save"></span>
    <span class="who" id="whoChip" hidden></span><select class="sel" id="persona" aria-label="視角" hidden></select>
    <button class="btn sm" id="langBtn" type="button">EN</button>
  </div>
</header>
<div class="weekbar pad">

<script>
/* ===== Apollo 預估表解析（F溫室色花出貨預估） ===== */
const VAR_ALIAS = {
  '0953':'SRM0953','0950':'SRM0950','1142':'SRM1142','SRM615':'SRM0615','615':'SRM0615',
  'JINJU':'Jinju','TEM079':'TEM079','TEM0079':'TEM079','1306-3':'L1306-3','HAPPY':'Happy Dancer',
  'HAPPY DANCER':'Happy Dancer',"FULLER'S":"Fuller's Sunset","FULLER'S SUNSET":"Fuller's Sunset",
  'FULLER':"Fuller's Sunset",'FULLER SUNSET':"Fuller's Sunset",'3E+43':'3E-43','DS2':'DS2 (SRM0665)',
  'CL234':'CL243','KV5701':'KV5701'
};
const CODE_AS_VARIETY = { 'SRM0665':['PUR','DS2 (SRM0665)'], 'SRM0615':['PUR','SRM0615'], 'SRM1387':['PUR','SRM1387'] };
function normVariety(v){
  if (v==null) return '';
  let s = String(v).replace(/\s+/g,' ').trim();
  const k = s.toUpperCase();
  return VAR_ALIAS[k] || s;
}
function normalizeProduct(rawCode, rawVar){
  let code = String(rawCode).replace(/\s+/g,' ').trim();
  if (CODE_AS_VARIETY[code.toUpperCase()]) { const [c,v]=CODE_AS_VARIETY[code.toUpperCase()]; return {code:c, variety:v}; }
  let variety = normVariety(rawVar);
  if (/^\d+$/.test(code) && !variety) variety = code;
  if (!variety) variety = 'Any';
  return { code, variety };
}
function cellNum(v){
  if (v==null) return 0;                 // 已收到的報表：空白視 0
  if (typeof v==='number') return v;
  const s=String(v).trim();
  if (s===''||/^[-–—]+$/.test(s)) return 0; // 橫線視 0
  const n=parseFloat(s.replace(/,/g,'')); return isNaN(n)?0:n;
}
/* rows: sheet_to_json(header:1) 二維陣列；anchor: 例如 'W44'（不給則取第一個週列） */
function parseApollo(rows, anchor){
  const acc = {}, weeksFound = [];
  for (let r=0;r<rows.length;r++){
    const a = String((rows[r]||[])[0]??'').trim();
    if (a.toLowerCase()!=='week') continue;
    const head = rows[r]||[], vrow = rows[r+1]||[];
    const info = {};
    for (let k=r+2;k<rows.length;k++){
      const lab = String((rows[k]||[])[0]??'').trim();
      if (!lab) { if (Object.keys(info).length) break; else continue; }
      if (lab.toLowerCase()==='week') break;
      info[lab.toUpperCase()] = rows[k]||[];
      if (/^W\d+$/i.test(lab) && !weeksFound.includes(lab.toUpperCase())) weeksFound.push(lab.toUpperCase());
    }
    const anc = (anchor || weeksFound[0] || '').toUpperCase();
    const nxt = anc ? 'W'+(parseInt(anc.slice(1))%53+1) : '';
    for (let c=1;c<head.length;c++){
      const rc = head[c];
      if (rc==null || String(rc).trim()==='') continue;
      if (/採收|朵數|備註/.test(String(rc))) continue;
      const {code, variety} = normalizeProduct(rc, vrow[c]);
      const key = code+'|'+variety;
      const o = acc[key] || (acc[key] = {key, code, variety, prod:null, stock:null, f6:null, next:null, wk:{}, src:[]});
      const put = (f,row)=>{ if(!row) return; const v=cellNum(row[c]); o[f]=(o[f]||0)+v; };
      put('stock', info['庫存']); put('f6', info['6F']); put('prod', info[anc]); put('next', info[nxt]);
      for (const L of Object.keys(info)) if (/^W\d+$/.test(L)) o.wk[L] = (o.wk[L]||0) + cellNum(info[L][c]);
      o.src.push(String(rc)+(vrow[c]!=null?'/'+String(vrow[c]).replace(/\s+/g,' '):''));
    }
  }
  const fl = x => x==null?null:Math.floor(x+1e-9); // 先加總後無條件捨去
  const list = Object.values(acc).map(o=>({...o, prod:fl(o.prod), stock:fl(o.stock), f6:fl(o.f6), next:fl(o.next), wk:Object.fromEntries(Object.entries(o.wk).map(([k,v])=>[k,fl(v)])),
    supplyRaw:(o.prod||0)+(o.stock||0)}));
  list.forEach(o=>{ o.supply = (o.prod==null&&o.stock==null)?null:fl((o.supplyRaw)); delete o.supplyRaw; });
  return { products:list, weeks:weeksFound };
}

  if(f==='customer'){if(live)return;const r=wk.rows.find(r=>r.id===inp.dataset.row);const v=inp.value.trim();if(r.customer===v)return;r.customer=v;if(v&&!S.custMem[v]){S.custMem[v]={region:r.region,owner:RG[r.region]?.owner||''};saveCust(v);}saveWeek(wkId,{rows:wk.rows});bump();refreshComputed();return;}
  if(f==='customer6'){if(live)return;const r=wk.rows6.find(r=>r.id===inp.dataset.row6);r.customer=inp.value.trim();saveWeek(wkId,{rows6:wk.rows6});return;}
  const q=parseQty(inp.value);

  if(f==='alloc'){const id=inp.dataset.row;wk.alloc[id]=wk.alloc[id]||{};
    let val=q;
    if(hasAuto(wkId,id,k)){const prevRaw=wk.alloc[id][k];wk.alloc[id][k]='auto';bump();const au=autoInfo(wkId).cells[id][k];wk.alloc[id][k]=prevRaw;if(q===au)val='auto';}

    if(!live)saveWeek(wkId,{alloc:{[id]:{[k]:val}}});}
  else if(f==='alloc6'){const id=inp.dataset.row6;wk.alloc6[id]=wk.alloc6[id]||{};wk.alloc6[id][k]=q;bump();if(!live)saveWeek(wkId,{alloc6:{[id]:{[k]:q}}});}
  else{const s=wk.sup[k]=wk.sup[k]||{prod:null,stock:null,f6:null,next:null};
    if(f==='supply'){s.prod=q==null?null:q-(s.stock||0);if(q==null)s.stock=null;}else s[f]=q;bump();
    if(!live){saveWeek(wkId,{sup:{[k]:s}});
      if(f==='prod'||f==='stock'){const si=grid().querySelector(`input[data-f="supply"][data-k="${CSS.escape(k)}"]`);if(si)si.value=supplyOf(k)??'';}

  if(!live&&f!=='alloc')inp.value=q??'';
  refreshComputed();
  if(!live&&f==='alloc'){inp.value=effA(wkId,inp.dataset.row,k)??'';}
}
function navTarget(inp,dr,dc){
  const all=[...grid().querySelectorAll('input,select,td[data-anyk]')].filter(e=>e.offsetParent||e.tagName==='TD');
  const pos=e=>{const td=e.tagName==='TD'?e:e.closest('td,th');return {r:td.parentElement.rowIndex,c:cellX(td)};};
  const p=pos(inp);let best=null,bd=1e9;
  for(const e of all){if(e===inp)continue;const q=pos(e);
    if(dr&&q.c===p.c&&Math.sign(q.r-p.r)===dr){const d=Math.abs(q.r-p.r);if(d<bd){bd=d;best=e;}}
    if(dc&&q.r===p.r&&Math.sign(q.c-p.c)===dc){const d=Math.abs(q.c-p.c);if(d<bd){bd=d;best=e;}}}
  return best;
}

class Slider{
  constructor(el,sc,dir){this.el=el;this.sc=sc;this.dir=dir;this.th=el.querySelector('.thumb');
    sc.addEventListener('scroll',()=>this.sync(),{passive:true});el.addEventListener('pointerdown',e=>this.down(e));new ResizeObserver(()=>this.sync()).observe(sc);}
  dims(){const v=this.dir==='v';return {total:v?this.sc.scrollHeight:this.sc.scrollWidth,view:v?this.sc.clientHeight:this.sc.clientWidth,pos:v?this.sc.scrollTop:this.sc.scrollLeft,track:v?this.el.clientHeight:this.el.clientWidth};}
  sync(){const d=this.dims();const ratio=Math.min(1,d.view/Math.max(1,d.total));const len=Math.max(28,d.track*ratio);const max=Math.max(0,d.total-d.view);const off=max?(d.pos/max)*(d.track-len):0;
    this.th.style[this.dir==='v'?'height':'width']=len+'px';this.th.style[this.dir==='v'?'top':'left']=off+'px';this.el.style.opacity=ratio>=1?.35:1;this.len=len;}
  down(e){e.preventDefault();const d=this.dims();const v=this.dir==='v';const r=this.el.getBoundingClientRect();const start=v?e.clientY:e.clientX;const onThumb=e.target===this.th;
    const max=d.total-d.view;const span=d.track-this.len;
    if(!onThumb){const p=(start-(v?r.top:r.left)-this.len/2)/Math.max(1,span);this.set(p*max);}
    const pos0=v?this.sc.scrollTop:this.sc.scrollLeft;
    this.th.classList.add('drag');this.el.setPointerCapture(e.pointerId);
    const mv=ev=>{const dl=(v?ev.clientY:ev.clientX)-start;if(onThumb)this.set(pos0+dl/Math.max(1,span)*max);else{const p=((v?ev.clientY:ev.clientX)-(v?r.top:r.left)-this.len/2)/Math.max(1,span);this.set(p*max);}};
    const up=()=>{this.th.classList.remove('drag');this.el.removeEventListener('pointermove',mv);this.el.removeEventListener('pointerup',up);this.el.removeEventListener('pointercancel',up);};
    this.el.addEventListener('pointermove',mv);this.el.addEventListener('pointerup',up);this.el.addEventListener('pointercancel',up);}
  set(x){if(this.dir==='v')this.sc.scrollTop=x;else this.sc.scrollLeft=x;}
}

function setZoom(z){

  const sc=$('#scroller');const fx=sc.scrollLeft/Math.max(1,sc.scrollWidth),fy=sc.scrollTop/Math.max(1,sc.scrollHeight);
  UI.zoom=z;saveUI();$('#zoom').value=z;$('#zv').textContent=z+'%';renderGrid();
  sc.scrollLeft=fx*sc.scrollWidth;sc.scrollTop=fy*sc.scrollHeight;
}
function initZoom(){
  $('#zoom').value=UI.zoom;$('#zv').textContent=UI.zoom+'%';
  $('#zoom').addEventListener('input',e=>setZoom(+e.target.value));
  $('#zIn').onclick=()=>setZoom(UI.zoom+10);$('#zOut').onclick=()=>setZoom(UI.zoom-10);
  const sc=$('#scroller');

  let pd=null,pz=100;
  sc.addEventListener('touchstart',e=>{if(e.touches.length===2){pd=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);pz=UI.zoom;}},{passive:true});
  sc.addEventListener('touchmove',e=>{if(e.touches.length===2&&pd){e.preventDefault();const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);setZoom(pz*d/pd);}},{passive:false});
  sc.addEventListener('touchend',()=>{pd=null;});
}

    if(b.includes('4775'))return {key:'4775|4775',dyed:true};if(b.includes('wst'))return {key:'WST|SRM0950',dyed:true};if(b.includes('purple'))return {key:'PUR|Any',dyed:true};
    if(b.includes('1142'))return {key:'B|SRM1142',dyed:true};if(b.includes('light pink'))return {key:'LP|Any',dyed:true};
    return {unmapped:true,why:'基底待確認'};
  }
  let paren=(/\(([^)]+)\)/.exec(raw)||[])[1]||'';let base=raw.replace(/\([^)]*\)/g,'').trim();
  let dashV='';const dm=/^(.+?)-((?:SRM|KV|CH|CL|L)\d[\w\-]*)$/i.exec(base);if(dm){base=dm[1];dashV=dm[2];}
  let code=list.some(p=>p.code.toUpperCase()===base.toUpperCase())?list.find(p=>p.code.toUpperCase()===base.toUpperCase()).code:(COLOR_NAMES[base.toLowerCase()]||null);
  if(!code&&/^[A-Z0-9\-]{1,8}$/.test(base))code=base;
  if(!code)return {unmapped:true};
  if(code==='W')return {key:party?'W (Party B)|SRM0533':'W (A+)|SRM0533'};
  let v=normVariety(variety||dashV||paren);if(/fuller|yellow with strip|tangerine|orange/i.test(v))v='';
  const cands=S.products.filter(p=>p.code===code);
  if(v){const hit=cands.find(p=>p.variety.toUpperCase()===v.toUpperCase());if(hit)return {key:hit.key};return {key:code+'|'+v,newItem:true};}
  if(cands.length===1)return {key:cands[0].key};
  if(code==='FS')return {key:"FS|Fuller's Sunset"};
  return {key:code+'|Any'};
}
async function readOrderExcel(file,list){
  const msg=$('#rqUpMsg');msg.textContent=UI.lang==='en'?'Reading…':'讀取中…';
  try{
    const X=await loadXLSX();const wb=X.read(await file.arrayBuffer(),{type:'array'});
    let filled=0,free=0,skipped=0,cust='',etd='';
    for(const n of wb.SheetNames){
      const rows=X.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});
      let hi=rows.findIndex(r=>r&&r.some(c=>/^(color|顏色)$/i.test(String(c??'').trim())));if(hi<0)continue;
      const H=rows[hi].map(c=>String(c??'').trim());const find=re=>H.findIndex(h=>re.test(h));
      const ci=find(/^(color|顏色)$/i),vi=find(/variety|品種/i),bi=find(/箱數|original order|rb can sup|boxes/i),si=find(/總枝數|total ste/i),gi=find(/等級|^lev/i),cu=find(/客戶|customer/i),ei=find(/etd|出貨日期/i),ni=find(/入數|^ste/i);
      for(let r=hi+1;r<rows.length;r++){const row=rows[r]||[];
        if(cu>=0&&row[cu]&&!cust)cust=String(row[cu]).split(/\n|\(/)[0].trim();
        if(ei>=0&&row[ei]&&!etd)etd=row[ei];
        const color=row[ci];if(!color||/total|合計/i.test(String(color)))continue;
        const m=mapOrderLine(color,vi>=0?row[vi]:'',gi>=0?row[gi]:'',list);
        let qty=si>=0?Number(row[si])||0:0;const bx=bi>=0?Number(row[bi])||0:0;
        if(!qty&&bx&&ni>=0)qty=bx*(Number(row[ni])||0);
        if(m&&m.box)qty=bx;
        if(!qty){skipped++;continue;}
        if(!m||m.unmapped||m.newItem){RQ.free.push({code:m&&m.newItem?m.key.split('|')[0]:String(color).trim(),variety:m&&m.newItem?m.key.split('|')[1]:(vi>=0&&row[vi]?String(row[vi]):'?'),qty:Math.floor(qty),remark:(m&&m.why?m.why+'；':'')+'原文 '+String(color).trim()});free++;continue;}
        RQ.qty[m.key]=(RQ.qty[m.key]||0)+Math.floor(qty);filled++;
        if(m.dyed)RQ.remark=(RQ.remark?RQ.remark+' + ':'')+String(color).trim()+' '+Math.floor(qty);
      }
    }
    if(cust){const known=Object.keys(S.custMem).find(k=>cust.toLowerCase().startsWith(k.toLowerCase()));if(known)cust=known;RQ.customer=cust;const mm=S.custMem[cust];if(mm)RQ.region=mm.region;}
    if(etd){let d=null;if(typeof etd==='number'){d=new Date(Date.UTC(1899,11,30)+etd*864e5);}else{const s=String(etd).replace(/\./g,'-').replace(/\//g,'-');const m=/(\d{4})-(\d{1,2})-(\d{1,2})/.exec(s);if(m)d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));}if(d)RQ.shipDate=d.toISOString().slice(0,10);}
    renderReq();
    $('#rqUpMsg').textContent=UI.lang==='en'?`Filled ${filled} lines · ${free} need mapping (added below) · ${skipped} zero lines skipped. Please check before submitting.`:`已填入 ${filled} 列・${free} 列待對應（已列在表末）・略過 ${skipped} 列 0 數量。送出前請核對。`;
  }catch(err){msg.textContent=(UI.lang==='en'?'Could not read: ':'無法讀取：')+err.message;}
}

   <span class="note" id="impMsg">${empty?(UI.lang==='en'?'Import works only while this workspace has no weeks or requests, so nothing can be overwritten.':'只有在這個工作區還沒有任何週次與需求時才能匯入，避免覆蓋資料。'):(UI.lang==='en'?'Import is locked because this workspace already has data.':'這個工作區已經有資料，匯入已鎖定以免覆蓋。')}</span></div></div>`;

    const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`SUNPRIDE_backup_${nowISO().slice(0,16).replace(/[-:T]/g,'')}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);};
  const io=$('#impOld');if(io&&empty)io.onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const msg=$('#impMsg');

function applyHash(){

  else if(r&&FBCFG){ROLE='req';TOKEN=r;UI.view='req';}
